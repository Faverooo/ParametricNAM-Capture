name: Build Capture

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            app: ParametricNAM Capture
          - os: windows-latest
            app: ParametricNAM Capture.exe
          - os: macos-latest
            app: ParametricNAM Capture.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check out JUCE 8.0.6
        uses: actions/checkout@v5
        with:
          repository: juce-framework/JUCE
          ref: 8.0.6
          path: ci-juce
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev libcurl4-openssl-dev
      - name: Configure CMake
        shell: bash
        env:
          PNAM_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set --
          if [[ "$RUNNER_OS" == macOS ]]; then
            set -- "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          fi
          cmake -S . -B build -DPNAM_JUCE_DIR=ci-juce -DCMAKE_BUILD_TYPE=Release \
            "-DPNAM_RELEASE_TAG=$PNAM_RELEASE_TAG" "$@"
      - run: cmake --build build --config Release --parallel 2
      - name: Simulate a capture session
        if: runner.os == 'Linux'
        run: |
          scratch=$(mktemp -d)
          "build/ParametricNAMCapture_artefacts/Release/ParametricNAM Capture" --self-test "$scratch/session"
      - name: Package Capture
        shell: bash
        env:
          APP: ${{ matrix.app }}
          ARCHIVE: ParametricNAM-Capture-${{ runner.os }}-${{ runner.os == 'macOS' && 'Universal' || runner.arch }}.zip
        run: |
          mkdir package
          cp -R "build/ParametricNAMCapture_artefacts/Release/$APP" package/
          if [[ "$RUNNER_OS" == macOS ]]; then
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "package/$APP/Contents/Info.plist")
            lipo "package/$APP/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          else
            cp build/ParametricNAMCapture_artefacts/Release/CaptureStimulus.wav package/
          fi
          cp README.md LICENSE package/
          cp ci-juce/LICENSE.md package/LICENSE-JUCE.md
          (cd package && cmake -E tar cf "../$ARCHIVE" --format=zip *)
      - uses: actions/upload-artifact@v6
        with:
          name: Capture-${{ runner.os }}-${{ runner.os == 'macOS' && 'Universal' || runner.arch }}
          path: ParametricNAM-Capture-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: Capture-*
          path: packages
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" --verify-tag --generate-notes packages/*.zip
